name: Claude PR review

# Reviews PRs with Claude on Vertex AI, following .github/review-guide.md.
#
# Required repo variables: GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID.
#   CLAUDE_REVIEW_USERS: JSON list of GitHub logins whose PRs get reviewed, e.g. ["rogthefrog", "wpietri"].
# Optional: CLAUDE_MODEL (default claude-opus-5-5), CLOUD_ML_REGION (default global).
#
# Runs automatically on PRs from branches in this repo (fork PRs get no OIDC token). Bot PRs are skipped.
# On demand: anyone in CLAUDE_REVIEW_USERS comments "/claude-review" on any PR, including PRs from forks.
# The comment trigger only works once this file is on the default branch.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.type != 'Bot'
        && contains(fromJSON(vars.CLAUDE_REVIEW_USERS || '[]'), github.event.pull_request.user.login)
      ) || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/claude-review')
        && contains(fromJSON(vars.CLAUDE_REVIEW_USERS || '[]'), github.event.comment.user.login)
      )
    # Job-level, so runs whose `if` is false (e.g. any other PR comment) don't cancel a review in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # Check out the PR's code for context. It's only read, never executed.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION || 'global' }}
        with:
          use_vertex: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request. Read .github/review-guide.md first and follow it exactly: it defines
            what to flag, severity levels, tone, and output length.

            - Only report CRITICAL, HIGH, or MEDIUM issues. Skip LOW.
            - Get the diff with `gh pr diff`. Read surrounding code in the repo when you need context.
            - Post each issue as an inline comment on the relevant line, at most 20 in total.
            - Then post one summary comment with `gh pr comment`, in the format the guide specifies.
            - If there's nothing worth flagging, post only the summary.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
